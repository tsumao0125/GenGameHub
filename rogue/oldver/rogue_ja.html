<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <link rel="icon" type="image/png" href="../img/favicon.png" />
  <title>Rogue Rebuilt 日本語版</title>
  <style>
    :root { color-scheme: dark; }
    body{
      margin:0; background:#070a0f; color:#d9e5f2;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }
    #app{
      max-width:1220px; margin:0 auto; padding:14px;
      display:grid; gap:12px;
      grid-template-columns: 1fr 360px;
      align-items:start;
    }
    @media (max-width: 980px){
      #app{ grid-template-columns: 1fr; }
      #side{ order:2; }
    }
    .card{
      background:#06080c; border:1px solid #1a2330; border-radius:14px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }
    #topbar{ display:flex; flex-wrap:wrap; gap:10px; padding:10px 12px; align-items:center;}
    .pill{ padding:6px 10px; border:1px solid #223148; border-radius:999px; background:#0b111a; }
    button, select, input{
      background:#0b111a; border:1px solid #263246; color:#d9e5f2;
      border-radius:12px; padding:9px 12px; cursor:pointer;
      font-family: inherit;
    }
    button:hover, select:hover{ filter:brightness(1.1); }
    button:active{ transform: translateY(1px); }
    select{ cursor:pointer; }

    #gameWrap{ padding:10px; }
    canvas{ width:100%; height:auto; display:block; border-radius:12px; background:#000; touch-action:manipulation; }

    #keymapBar{ padding:10px 12px; margin:10px; }
    #keymapText{ opacity:.92; line-height:1.35; }

    #side{ display:grid; gap:12px; }
    #stats{ padding:12px; }
    #stats h3{ margin:0 0 8px 0; font-size:14px; opacity:.9; }
    #stats .row{ display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed #1a2330; }
    #stats .row:last-child{ border-bottom:0; }
    #log{ padding:12px; min-height:140px; }
    #log h3{ margin:0 0 8px 0; font-size:14px; opacity:.9; }
    #log .line{ opacity:.92; padding:3px 0; }

    #controls{ padding:12px; display:grid; gap:10px; }
    #controls h3{ margin:0; font-size:14px; opacity:.9; }
    .pad{ display:grid; grid-template-columns: 1fr 1fr 1fr; gap:8px; }
    .pad button{ padding:12px 0; }
    .pad .spacer{ visibility:hidden; }
    .ctrlRow{ display:flex; gap:8px; flex-wrap:wrap; }

    kbd{ border:1px solid #263246; border-bottom-width:3px; padding:1px 6px; border-radius:6px; background:#0b111a; }

    /* Modal */
    #modal{
      position:fixed; inset:0; background: rgba(0,0,0,.55);
      display:none; align-items:center; justify-content:center; padding:18px;
      z-index: 50;
    }
    #modal.show{ display:flex; }
    .modalCard{
      width:min(980px, 100%); max-height:min(86vh, 820px);
      overflow:auto; padding:14px;
    }
    .modalHeader{
      display:flex; gap:10px; align-items:center; justify-content:space-between;
      margin-bottom:10px;
    }
    .modalHeader h2{ margin:0; font-size:16px; }
    .grid2{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
    @media (max-width: 740px){ .grid2{ grid-template-columns: 1fr; } }
    .box{ padding:12px; border:1px solid #1a2330; border-radius:12px; background:#070a10; }
    .itemRow{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px dashed #1a2330;}
    .itemRow:last-child{ border-bottom:0; }
    .itemLeft{ display:flex; gap:10px; align-items:center; }
    .badge{ width:28px; height:28px; display:grid; place-items:center;
            border:1px solid #223148; border-radius:8px; background:#0b111a; }
    .muted{ opacity:.75; font-size:12px; }
    .small{ font-size:12px; opacity:.85; }
    .danger{ border-color:#5b1d26; }

    @media (max-width: 740px){
      #app{ padding:10px; gap:10px; }
      #topbar{ padding:8px 10px; gap:8px; }
      #topbar .pill{ width:100%; border-radius:12px; }
      #topbar button{ flex:1 1 calc(50% - 8px); min-height:42px; }
      button, select, input{ min-height:42px; }
      #gameWrap{ padding:8px; }
      #keymapBar{ margin:8px; padding:8px 10px; }
      #keymapText{ font-size:12px; line-height:1.45; }
      #side{ gap:10px; }
      #stats, #controls, #log{ padding:10px; }
      .pad button{ min-height:46px; }
      .ctrlRow button{ flex:1 1 calc(50% - 8px); }
      #modal{ padding:10px; }
      .modalCard{ padding:10px; max-height:90vh; }
      .modalHeader{ align-items:flex-start; flex-direction:column; }
    }

    @media (max-width: 480px){
      #app{ padding:8px; gap:8px; }
      #topbar{ padding:8px; gap:6px; }
      #topbar button{ flex:1 1 100%; }
      #stats .row{ font-size:13px; }
      #controls .small{ font-size:11px; }
      .ctrlRow button{ flex:1 1 100%; }
      #keymapText{ font-size:11px; }
    }
  </style>
</head>
<body>
  <div data-site-header></div>
<div id="app">
    <div class="card" id="main">
      <div id="topbar">
        <div class="pill" id="hud">Loading...</div>

        <div class="pill" style="opacity:.92; display:flex; gap:8px; align-items:center;">
          入力:
          <select id="inputMode">
            <option value="hjkl">HJKL (クラシック)</option>
            <option value="wasd">WASD (移動重視)</option>
            <option value="pointer">マウス / タップ</option>
          </select>
        </div>

        <div class="pill" style="opacity:.88">
          Help: <kbd>F1</kbd> | インベントリ: <kbd>i</kbd> | Wait: <kbd>.</kbd> | Save: <kbd>S</kbd> | Quit: <kbd>Q</kbd>
        </div>

        <button id="btnInv">インベントリ</button>
        <button id="btnHelp">ヘルプ (F1)</button>
        <button id="btnRestart">新規開始</button>
      </div>

      <div id="gameWrap">
        <canvas id="cv" width="960" height="540" aria-label="game canvas"></canvas>

        <div class="card" id="keymapBar">
          <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between;">
            <div id="keymapText"></div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <button id="btnLegend">凡例 (/)</button>
              <button id="btnTraps">罠 (^)</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="side">
      <div class="card" id="stats">
        <h3>ステータス</h3>
        <div class="row"><span>HP</span><span id="sHP">-</span></div>
        <div class="row"><span>攻撃 / 防御</span><span id="sAD">-</span></div>
        <div class="row"><span>満腹度</span><span id="sFood">-</span></div>
        <div class="row"><span>階層 / ターン</span><span id="sFT">-</span></div>
        <div class="row"><span>武器</span><span id="sW">-</span></div>
        <div class="row"><span>防具</span><span id="sA">-</span></div>
        <div class="row"><span>指輪</span><span id="sR">-</span></div>
      </div>

      <div class="card" id="controls">
        <h3>クイック</h3>
        <div class="small">
          ポインターモード: マスをタップで自動移動 (A*)。同じマスでキャンセル。
        </div>
                        <div class="pad">
          <button data-m="-1,-1">&#8598;</button>
          <button data-m="0,-1">&#8593;</button>
          <button data-m="1,-1">&#8599;</button>

          <button data-m="-1,0">&#8592;</button>
          <button id="btnWait">.</button>
          <button data-m="1,0">&#8594;</button>

          <button data-m="-1,1">&#8601;</button>
          <button data-m="0,1">&#8595;</button>
          <button data-m="1,1">&#8600;</button>
        </div>
        <div class="ctrlRow">
          <button id="btnPickup">拾う (,)</button>
          <button id="btnSearch">探索 (s)</button>
          <button id="btnDown">下り (>)</button>
          <button id="btnUp">上り (&lt;)</button>
        </div>
      </div>

      <div class="card" id="log">
        <h3>ログ</h3>
        <div id="logLines"></div>
      </div>
    </div>
  </div>

  <!-- Universal modal -->
  <div id="modal" role="dialog" aria-modal="true">
    <div class="card modalCard">
      <div class="modalHeader">
        <h2 id="modalTitle">メニュー</h2>
        <div style="display:flex; gap:8px; align-items:center;">
          <div class="pill" id="modalHint" style="opacity:.9"></div>
          <button id="btnClose">閉じる</button>
        </div>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    (function () {
      var isMobile = window.matchMedia('(max-width: 900px)').matches ||
                     window.matchMedia('(pointer: coarse)').matches;
      var s = document.createElement('script');
      s.src = isMobile ? 'js/roguelike_mobile.js' : 'js/roguelike_ja.js';
      s.async = true;
      document.body.appendChild(s);
    })();
  </script>
  <script src="../scripts/site-header.js"></script>

</body>
</html>
