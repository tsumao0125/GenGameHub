<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<link rel="icon" type="image/png" href="../img/favicon.png" />
<title>Rogue Modern v2 (ASCII + Modern FX)</title>
<style>
  :root { color-scheme: dark; }
  body{
    margin:0; background:#070a0f; color:#d9e5f2;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  #app{
    max-width:1300px; margin:0 auto; padding:14px;
    display:grid; gap:12px;
    grid-template-columns: 1fr 380px;
    align-items:start;
  }
  @media (max-width: 980px){
    #app{ grid-template-columns: 1fr; }
    #side{ order:-1; }
  }
  .card{
    background:#06080c; border:1px solid #1a2330; border-radius:16px;
    box-shadow: 0 12px 40px rgba(0,0,0,.28);
  }
  #topbar{ display:flex; flex-wrap:wrap; gap:10px; padding:10px 12px; align-items:center;}
  .pill{ padding:6px 10px; border:1px solid #223148; border-radius:999px; background:#0b111a; }
  button, select{
    background:#0b111a; border:1px solid #263246; color:#d9e5f2;
    border-radius:12px; padding:9px 12px; cursor:pointer;
    font-family: inherit;
  }
  button:hover, select:hover{ filter:brightness(1.1); }
  button:active{ transform: translateY(1px); }
  select{ cursor:pointer; }

  #gameWrap{ padding:10px; position:relative; }
  canvas{ width:100%; height:auto; display:block; border-radius:14px; background:#000; }

  /* Overlay HUD inside canvas area */
  #overlay{
    position:absolute; inset:10px; pointer-events:none;
  }
  #cornerHud{
    position:absolute; left:10px; top:10px;
    display:flex; gap:8px; flex-wrap:wrap;
    pointer-events:none;
  }
  .chip{
    padding:6px 10px; border:1px solid #223148; border-radius:999px;
    background:rgba(11,17,26,.72);
    backdrop-filter: blur(6px);
    font-size:12px; opacity:.95;
  }
  #miniWrap{
    position:absolute; right:10px; top:10px;
    width:168px; height:112px;
    border-radius:12px;
    border:1px solid #223148;
    background:rgba(0,0,0,.35);
    overflow:hidden;
  }
  #minimap{
    width:100%; height:100%;
    image-rendering: pixelated;
  }

  #keymapBar{ padding:10px 12px; margin:10px; }
  #keymapText{ opacity:.92; line-height:1.35; }

  #side{ display:grid; gap:12px; }
  #stats{ padding:12px; }
  #stats h3{ margin:0 0 8px 0; font-size:14px; opacity:.9; }
  #stats .row{ display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed #1a2330; }
  #stats .row:last-child{ border-bottom:0; }
  #log{ padding:12px; min-height:140px; }
  #log h3{ margin:0 0 8px 0; font-size:14px; opacity:.9; }
  #log .line{ opacity:.92; padding:3px 0; }

  #controls{ padding:12px; display:grid; gap:10px; }
  #controls h3{ margin:0; font-size:14px; opacity:.9; }
  .small{ font-size:12px; opacity:.8; line-height:1.35; }
  .pad{ display:grid; grid-template-columns: 1fr 1fr 1fr; gap:8px; }
  .pad button{ padding:12px 0; }
  .pad .spacer{ visibility:hidden; }
  .ctrlRow{ display:flex; gap:8px; flex-wrap:wrap; }

  kbd{ border:1px solid #263246; border-bottom-width:3px; padding:1px 6px; border-radius:6px; background:#0b111a; }

  /* Modal */
  #modal{
    position:fixed; inset:0; background: rgba(0,0,0,.60);
    display:none; align-items:center; justify-content:center; padding:18px;
    z-index: 50;
  }
  #modal.show{ display:flex; }
  .modalCard{
    width:min(1000px, 100%); max-height:min(86vh, 860px);
    overflow:auto; padding:14px;
  }
  .modalHeader{
    display:flex; gap:10px; align-items:center; justify-content:space-between;
    margin-bottom:10px;
  }
  .modalHeader h2{ margin:0; font-size:16px; }
  .grid2{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
  @media (max-width: 740px){ .grid2{ grid-template-columns: 1fr; } }
  .box{ padding:12px; border:1px solid #1a2330; border-radius:12px; background:#070a10; }
  .itemRow{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px dashed #1a2330;}
  .itemRow:last-child{ border-bottom:0; }
  .itemLeft{ display:flex; gap:10px; align-items:center; }
  .badge{ width:28px; height:28px; display:grid; place-items:center;
          border:1px solid #223148; border-radius:8px; background:#0b111a; }
  .muted{ opacity:.75; font-size:12px; }
  .danger{ border-color:#5b1d26; }

  /* Aim cursor */
  #aimHint{
    position:absolute; left:10px; bottom:10px;
    padding:6px 10px; border:1px solid #223148; border-radius:999px;
    background:rgba(11,17,26,.72); backdrop-filter: blur(6px);
    font-size:12px; opacity:.95;
    display:none;
  }
  #aimHint.show{ display:block; }
</style>
</head>
<body>
<div data-site-header></div>
<div id="app">
  <div class="card" id="main">
    <div id="topbar">
      <div class="pill" id="hud">Loading...</div>

      <div class="pill" style="opacity:.92; display:flex; gap:8px; align-items:center;">
        Input:
        <select id="inputMode">
          <option value="hjkl">HJKL (Classic Rogue)</option>
          <option value="wasd">WASD (Move-first)</option>
          <option value="pointer">Mouse / Tap</option>
        </select>
      </div>

      <button id="btnInv">Inventory</button>
      <button id="btnHelp">Help (F1)</button>
      <button id="btnRestart">New Run</button>
      <button id="btnSave">Save</button>
      <button id="btnLoad">Load</button>
    </div>

    <div id="gameWrap">
      <canvas id="cv" width="960" height="540"></canvas>

      <div id="overlay">
        <div id="cornerHud">
          <div class="chip" id="chipFloor">Floor -</div>
          <div class="chip" id="chipHP">HP -</div>
          <div class="chip" id="chipFood">Food -</div>
          <div class="chip" id="chipMode">MODE -</div>
        </div>

        <div id="miniWrap">
          <canvas id="minimap" width="168" height="112"></canvas>
        </div>

        <div id="aimHint"></div>
      </div>

      <div class="card" id="keymapBar">
        <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between;">
          <div id="keymapText"></div>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button id="btnLegend">Legend (/)</button>
            <button id="btnTraps">Traps (^)</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="side">
    <div class="card" id="stats">
      <h3>Status</h3>
      <div class="row"><span>HP</span><span id="sHP">-</span></div>
      <div class="row"><span>ATK / DEF</span><span id="sAD">-</span></div>
      <div class="row"><span>Food</span><span id="sFood">-</span></div>
      <div class="row"><span>Floor / Turn</span><span id="sFT">-</span></div>
      <div class="row"><span>Weapon</span><span id="sW">-</span></div>
      <div class="row"><span>Armor</span><span id="sA">-</span></div>
      <div class="row"><span>Ring</span><span id="sR">-</span></div>
    </div>

    <div class="card" id="controls">
      <h3>Quick</h3>
      <div class="small">
        Pointer mode: tap a tile to auto-walk (A*). Tap same tile to cancel.<br/>
        In HJKL mode: full classic commands (d/e/q/r/w/W/T/f/z/c/s etc).
      </div>
      <div class="pad">
        <button data-m="-1,-1">↖</button>
        <button data-m="0,-1">↑</button>
        <button data-m="1,-1">↗</button>

        <button data-m="-1,0">←</button>
        <button id="btnWait">・</button>
        <button data-m="1,0">→</button>

        <button data-m="-1,1">↙</button>
        <button data-m="0,1">↓</button>
        <button data-m="1,1">↘</button>
      </div>
      <div class="ctrlRow">
        <button id="btnPickup">Pickup (,)</button>
        <button id="btnSearch">Search (s)</button>
        <button id="btnDown">Down (>)</button>
        <button id="btnUp">Up (&lt;)</button>
      </div>
    </div>

    <div class="card" id="log">
      <h3>Log</h3>
      <div id="logLines"></div>
    </div>
  </div>
</div>

<div id="modal" role="dialog" aria-modal="true">
  <div class="card modalCard">
    <div class="modalHeader">
      <h2 id="modalTitle">Menu</h2>
      <div style="display:flex; gap:8px; align-items:center;">
        <div class="pill" id="modalHint" style="opacity:.9"></div>
        <button id="btnClose">Close</button>
      </div>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script src="js/rogue.modern.js?v=20260301e" defer></script>
<script src="../scripts/site-header.js"></script>
</body>
</html>
