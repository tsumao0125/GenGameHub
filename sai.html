overlay(){if(this.state===S.P){this.ov.innerHTML="";return}if(this.state===S.T){this.ov.innerHTML=`<div class="p"><h1>Sai v1 3D</h1><p class="small">Three.js + Rapier の3D石積み。河原ステージのみ。アクティブ石は左ドラッグ移動・右ドラッグ回転、Spaceでそっと置く。</p><div class="row"><button id="st" class="pr">開始</button></div><p class="small">保存済みポイント: ${this.points}</p></div>`;this.ov.querySelector("#st").onclick=()=>this.set(S.M);return}if(this.state===S.M){this.ov.innerHTML=`<div class="p"><h2>ロケーション選択</h2><div class="row">${Object.values(L).map(v=>`<div class="card"><h3>${v.name}</h3><div class="small">${v.env}</div><div class="small">摩擦:${v.fr.toFixed(2)} 密度:${v.de.toFixed(2)} 倍率:x${v.m.toFixed(2)}<br/>BEST:${this.best[v.key]||0}</div><div class="row" style="margin-top:8px"><button class="pr" data-k="${v.key}">ここで遊ぶ</button></div></div>`).join("")}</div></div>`;this.ov.querySelectorAll("button[data-k]").forEach(b=>b.onclick=()=>this.start(b.dataset.k));return}if(this.state===S.R){const best=this.loc?(this.best[this.loc.key]||0):0;this.ov.innerHTML=`<div class="p"><h2>RESULT</h2><p class="small">${this.loc?this.loc.name:"-"} の結果</p><div class="small">段数:${this.stack}<br/>安定ボーナス:${this.bonus}<br/>スコア:${this.lastScore}<br/>獲得ポイント:+${this.lastPts}<br/>この場所のBEST:${best}<br/>所持ポイント:${this.points}</div><div class="row" style="margin-top:10px"><button id="mp" class="pr">MAPへ戻る</button><button id="rt">同じ場所で再挑戦</button></div></div>`;this.ov.querySelector("#mp").onclick=()=>this.set(S.M);this.ov.querySelector("#rt").onclick=()=>this.start(this.loc.key);}}
handleInput(){this.ctrl.update()}render(){this.r.render(this.s,this.cam)}animate(){requestAnimationFrame(()=>this.animate());const dt=Math.min(.05,this.clock.getDelta());this.handleInput();this.updatePhysics(dt);this.checkStability(dt);this.fail();if(this.state===S.P)this.hud(this.gauge());this.render()}
rr(a,b){return Math.random()*(b-a)+a}clamp(v,a,b){return Math.max(a,Math.min(b,v))}}
new G().init();
</script></body></html>
